spring.application.name=crimson-citadel

# Docker MySQL (docker-compose.yml)
spring.datasource.url=jdbc:mysql://localhost:3306/crimson_citadel
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345678

# update: 엔티티에 맞춰 스키마를 변경만 하고 기존 데이터는 지우지 않는다.
# (create / create-drop 은 재시작할 때마다 테이블을 새로 만들어 저장이 사라진다.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
